version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 } # don't adopt releases younger than a week
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directories: [/server, /spike/ladder]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: pip # the local test relay (server/tests/mailbox-requirements.txt)
    directory: /server/tests
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      pip: { patterns: ["*"] }
