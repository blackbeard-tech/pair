name: release
# Tag-triggered only (git tag vX.Y.Z && git push origin vX.Y.Z).
# Cost: one macOS job (bills 10x) builds both Mac targets; Windows is cross-built on Linux (1x).
# After it runs: copy the release's checksums.txt into plugin/checksums.txt under a '# release vX.Y.Z' header,
# set plugin.json version to the same X.Y.Z, and commit. CI fails if the two ever differ.
on:
  push: { tags: ["v*"] }

permissions: {}

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45 # notarization usually takes a few minutes, occasionally much longer
    permissions: { contents: read }
    # Signing secrets live only in this environment, which only v* tag runs can enter.
    environment: release
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -t aarch64-apple-darwin,x86_64-apple-darwin && rustup default stable
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$t"
            cp "target/$t/release/pair" "../pair-$t"
          done

      # Secrets go only to Apple's own tools, never to third-party actions, and are never printed.
      - name: sign (Developer ID, hardened runtime)
        working-directory: .
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(openssl rand -hex 24)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          identity=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          for f in pair-*; do
            codesign --force --options runtime --timestamp --identifier tech.blackbeard.pair --sign "$identity" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          codesign -dv pair-aarch64-apple-darwin 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)='

      - name: notarize
        working-directory: .
        env:
          KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          mkdir -p "$RUNNER_TEMP/notarize" && cp pair-* "$RUNNER_TEMP/notarize/"
          ditto -c -k "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          out=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --wait --timeout 40m --output-format json)
          echo "$out"
          if [ "$(jq -r .status <<<"$out")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id <<<"$out")" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID" || true
            exit 1
          fi

      - name: remove signing material
        if: always()
        working-directory: .
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos, path: "pair-*", if-no-files-found: error }

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends gcc-mingw-w64-x86-64
      - run: rustup toolchain install stable --profile minimal -t x86_64-pc-windows-gnu && rustup default stable
      - run: |
          cargo build --locked --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/pair.exe ../pair-x86_64-pc-windows-gnu.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: windows, path: "pair-*", if-no-files-found: error }

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: tag matches server/Cargo.toml version
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          [ "v$cargo_v" = "$TAG" ] || { echo "::error::$TAG vs Cargo $cargo_v"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: dist, merge-multiple: true }
      - working-directory: dist
        run: sha256sum pair-* | tee checksums.txt
      - name: create release
        working-directory: dist
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}", REPO: "${{ github.repository }}" }
        run: |
          pre=""; case "$TAG" in *-*) pre=--prerelease ;; esac  # e.g. v0.1.7-rc.1: test builds, never pinned
          gh release create "$TAG" pair-* checksums.txt $pre --repo "$REPO" --title "$TAG" --notes "Binaries for the pair plugin. macOS binaries are signed (Developer ID) and notarized; Windows is unsigned. Verify against checksums.txt; the plugin pins these hashes in plugin/checksums.txt."
