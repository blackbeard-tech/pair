name: release
# Tag-triggered only (git tag vX.Y.Z && git push origin vX.Y.Z).
#
# Stages, each saving its own artifact so a later failure never loses earlier work:
#   macos-build  -> artifact macos-unsigned
#   macos-sign   -> artifact macos-signed      (needs the release environment's certificate)
#   macos-notarize                              (submits to Apple and exits; doesn't wait for the verdict)
#   notarization-check.yml (hourly, up to 48 h) -> artifact macos-notarized once Apple's ticket exists
#   windows      -> artifact windows
#   publish      -> GitHub release, with the best macOS stage available: signed, else unsigned.
#   notes        -> records the notarization outcome on the release.
# Notarization doesn't change a bare binary (Apple stores the ticket online), so a signed release is
# final when published: checksums don't change when notarization finishes later.
#
# After it runs: copy the release's checksums.txt into plugin/checksums.txt under a '# release vX.Y.Z' header,
# set plugin.json version to the same X.Y.Z, and commit. CI fails if the two ever differ.
on:
  push: { tags: ["v*"] }

permissions: {}

jobs:
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions: { contents: read }
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -t aarch64-apple-darwin,x86_64-apple-darwin && rustup default stable
      - run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$t"
            cp "target/$t/release/pair" "../pair-$t"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos-unsigned, path: "pair-*", if-no-files-found: error }

  # Secrets go only to Apple's own tools in plain shell steps, never to third-party actions, and are
  # never printed. They exist only in the release environment, which only v* tag runs can enter.
  macos-sign:
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 15
    permissions: { contents: read }
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: macos-unsigned }
      - name: sign (Developer ID, hardened runtime)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(openssl rand -hex 24)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc"
          identity=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "::error::no valid Developer ID Application identity (expired or missing certificate?)"; exit 1; }
          for f in pair-*; do
            codesign --force --options runtime --timestamp --identifier tech.blackbeard.pair --sign "$identity" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          codesign -dvv pair-aarch64-apple-darwin 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp)='
      - name: remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: macos-signed, path: "pair-*", if-no-files-found: error }

  macos-notarize:
    needs: macos-sign
    runs-on: macos-latest
    timeout-minutes: 15 # upload only; notarization-check.yml follows up hourly for up to 48 h
    permissions: { contents: read }
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: macos-signed }
      - name: submit for notarization
        env:
          KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          mkdir -p "$RUNNER_TEMP/notarize" && cp pair-* "$RUNNER_TEMP/notarize/"
          ditto -c -k "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          out=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --output-format json)
          echo "$out"
          id=$(jq -r '.id // empty' <<<"$out")
          [ -n "$id" ] || { echo "::error::Apple didn't accept the upload"; exit 1; }
          echo "::notice::submitted to Apple: $id. Verdict and reason: xcrun notarytool info|log $id --key ... --key-id ... --issuer ..."
      - name: remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/notary.p8"

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read }
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends gcc-mingw-w64-x86-64
      - run: rustup toolchain install stable --profile minimal -t x86_64-pc-windows-gnu && rustup default stable
      - run: |
          cargo build --locked --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/pair.exe ../pair-x86_64-pc-windows-gnu.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: windows, path: "pair-*", if-no-files-found: error }

  # Runs as soon as builds and signing are done (or signing failed): never waits for notarization.
  publish:
    needs: [macos-build, macos-sign, windows]
    if: ${{ !cancelled() && needs.macos-build.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: tag matches server/Cargo.toml version
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' server/Cargo.toml | head -1)
          [ "v$cargo_v" = "$TAG" ] || { echo "::error::$TAG vs Cargo $cargo_v"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: windows, path: dist }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: "${{ needs.macos-sign.result == 'success' && 'macos-signed' || 'macos-unsigned' }}", path: dist }
      - working-directory: dist
        run: sha256sum pair-* | tee checksums.txt
      - name: create release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SIGNED: ${{ needs.macos-sign.result == 'success' }}
        run: |
          pre=""; case "$TAG" in *-*) pre=--prerelease ;; esac  # e.g. v0.1.7-rc.1: test builds, never pinned
          if [ "$SIGNED" = true ]; then
            mac="macOS: signed (Developer ID). Notarization: in progress."
          else
            mac="macOS: UNSIGNED (signing failed: check the certificate). Notarization: not attempted."
            echo "::warning::publishing unsigned macOS binaries"
          fi
          gh release create "$TAG" pair-* checksums.txt $pre --repo "$REPO" --title "$TAG" --notes "Binaries for the pair plugin.

          - $mac
          - Windows: unsigned.

          Verify against checksums.txt; the plugin pins these hashes in plugin/checksums.txt."

  # Records how notarization ended. The published files are unchanged either way.
  notes:
    needs: [publish, macos-sign, macos-notarize]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.macos-sign.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.macos-notarize.result }}
        run: |
          if [ "$RESULT" = success ]; then
            now="Notarization: pending at Apple (checked hourly for up to 48 hours)."
          else
            now="Notarization: not submitted (see the macos-notarize job log). The binaries are signed."
          fi
          body=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
          gh release edit "$TAG" --repo "$REPO" --notes "${body/Notarization: in progress./$now}"
