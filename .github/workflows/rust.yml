name: rust
# Kept small on purpose (free account): push/PR runs one Linux runner, only when server/ changes.
# macOS + Windows: manual dispatch only (release.yml builds them but doesn't run tests).
on:
  push: { branches: [main], paths: ["server/**", ".github/workflows/rust.yml"] }
  pull_request: { paths: ["server/**", ".github/workflows/rust.yml"] }
  schedule: [{ cron: "41 5 * * 1" }] # weekly: new advisories against unchanged code
  workflow_dispatch:
    inputs:
      targets: { description: "Also run on macOS + Windows", type: boolean, default: true }

permissions: {}

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.targets && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions: { contents: read }
    defaults:
      run: { shell: bash, working-directory: server }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - run: cargo fmt --check
      - name: cargo deny (vulnerabilities, licences, bans, sources)
        if: runner.os == 'Linux'
        env: { V: 0.20.2, SHA: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f }
        run: |
          curl -fsSLo /tmp/deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/${V}/cargo-deny-${V}-x86_64-unknown-linux-musl.tar.gz"
          echo "${SHA}  /tmp/deny.tgz" | sha256sum -c -
          tar xzf /tmp/deny.tgz -C /tmp --strip-components=1
          /tmp/cargo-deny --locked check
      - run: cargo clippy --locked --release -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      # Linux: a local mailbox server (hash-pinned wheels), so CI doesn't fail when the public relay is slow.
      # The weekly run and the macOS/Windows runs also go over the public relay.
      - name: e2e over a local relay
        if: runner.os == 'Linux'
        run: |
          python3 -m venv /tmp/mbx
          /tmp/mbx/bin/pip install -q --require-hashes --only-binary :all: --no-deps -r tests/mailbox-requirements.txt
          /tmp/mbx/bin/twist wormhole-mailbox --port tcp:4777:interface=127.0.0.1 --channel-db=/tmp/c.db --usage-db=/tmp/u.db &
          for _ in $(seq 30); do (exec 3<>/dev/tcp/127.0.0.1/4777) 2>/dev/null && break; sleep 1; done
          PAIR_RELAY=ws://127.0.0.1:4777/v1 python3 -I tests/two_peers.py target/release/pair
      - name: e2e over the public relay
        if: runner.os != 'Linux' || github.event_name == 'schedule'
        run: |
          PY=$(command -v python3 || command -v python)
          BIN=target/release/pair; [ "$RUNNER_OS" = Windows ] && BIN=$BIN.exe
          "$PY" -I tests/two_peers.py "$BIN"
