[package]
name = "pair"
version = "0.1.20"
edition = "2024"
publish = false
license = "Apache-2.0"
authors = ["Blackbeard Technologies"]
homepage = "https://blackbeard.tech"
repository = "https://github.com/blackbeard-tech/pair"
description = "MCP server that pairs two Claude Code sessions with a one-time code over magic-wormhole"

[dependencies]
magic-wormhole = { version = "=0.8.1", default-features = false, features = ["transit", "native-tls"] }  # wss:// mailbox; trusts the system CA store
futures = "0.3"  # already in the tree via magic-wormhole
url = "2"       # already in the tree via magic-wormhole
percent-encoding = "2"  # already in the tree via url
async-channel = "2"
async-io = "2"
futures-lite = "2"
serde_json = "1"
base64 = "=0.23.1"  # already in the tree via magic-wormhole
sha2 = "=0.11.1"

# Linux: native-tls uses OpenSSL. Build it from source and link it in, so the static musl release binaries stay
# self-contained (needs a C compiler for the target: musl-tools in CI). macOS and Windows use their own TLS.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
strip = true
lto = true
