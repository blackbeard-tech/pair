[package]
name = "pair"
version = "0.1.10"
edition = "2024"
publish = false
license = "Apache-2.0"
authors = ["Blackbeard Technologies"]
homepage = "https://blackbeard.tech"
repository = "https://github.com/blackbeard-tech/pair"
description = "Claude Code channel: pair two agents with a one-time code over magic-wormhole"

[dependencies]
magic-wormhole = { version = "=0.8.1", default-features = false, features = ["transit"] }
futures = "0.3"  # already in the tree via magic-wormhole
url = "2"       # already in the tree via magic-wormhole
async-channel = "2"
async-io = "2"
futures-lite = "2"
serde_json = "1"
base64 = "=0.22.1"  # already in the tree via magic-wormhole
sha2 = "=0.10.9"

[profile.release]
strip = true
lto = true
