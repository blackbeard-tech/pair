[package]
name = "pair"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
authors = ["Blackbeard Technologies"]
homepage = "https://blackbeard.tech"
repository = "https://github.com/d0d55/pair"
description = "Claude Code channel: pair two agents with a one-time code over magic-wormhole"

[dependencies]
magic-wormhole = { version = "=0.8.1", default-features = false }
async-channel = "2"
async-io = "2"
futures-lite = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
